<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>[테스트] 화면 사진 가리기 확인용</title>
    <style>
      body { margin: 0; background: #ffffff; color: #111111; font: 18px/1.5 sans-serif; }
      main { padding: 16px 24px; }
      h1 { margin: 0 0 8px; font-size: 26px; }
      p, table, form, iframe, svg { margin: 0 0 12px; }
      input { display: block; width: 320px; height: 36px; font-size: 20px; }
      td, th { padding: 4px 12px; border: 1px solid #888888; text-align: left; }
      iframe { display: block; width: 320px; height: 80px; border: 0; }
    </style>
  </head>
  <body>
    <main id="main">
      <h1>화면 사진 가리기 확인</h1>
      <p id="plain">이 문단은 가리지 않는 보통 글입니다. 사진에 그대로 보여야 합니다.</p>
      <svg id="notice" role="img" aria-label="긴급 안내 그림" width="320" height="60">
        <rect width="320" height="60" fill="#0b5fff"></rect>
        <text x="16" y="38" fill="#ffffff" font-size="22">긴급 안내: 접수 기간 연장</text>
      </svg>
      <form id="memo-form" onsubmit="return false">
        <label for="memo">메모</label>
        <input id="memo" name="memo" type="text" autocomplete="off" />
      </form>
      <p id="rrn">주민등록번호 900101-1234567</p>
      <table>
        <tr><th>계좌번호</th><td id="account">110-123-456789</td></tr>
        <tr><th>담당 부서</th><td id="office">복지정책과</td></tr>
      </table>
      <iframe id="frame" title="내장 문서" srcdoc="<body style='margin:0;background:#ffd400'><p>내장 문서 안의 글</p></body>"></iframe>
      <button id="close" type="button">닫기</button>
    </main>
  </body>
</html>
