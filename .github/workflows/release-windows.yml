name: Release Windows app

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Check release version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw apps/desktop/package.json | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $env:GITHUB_REF_NAME -cne "v$version") {
            throw "The stable release tag must match apps/desktop/package.json (v$version)."
          }
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --managed-python --python 3.12
      - uses: actions/cache@v4
        with:
          path: models
          key: desktop-models-${{ runner.os }}-${{ hashFiles('scripts/setup_local_models.py', 'scripts/convert_whisper_ct2.py', 'uv.lock') }}
      - run: uv run --locked python scripts/setup_local_models.py --only pii
      - run: npm ci --prefix apps/desktop
      - run: npm --prefix apps/desktop run test:updates
      - run: npm --prefix apps/desktop run dist:win
      - run: npm --prefix apps/desktop run test:release
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          compression-level: 0
          if-no-files-found: error
          path: |
            apps/desktop/dist/Cheongeum-Setup-*.exe
            apps/desktop/dist/Cheongeum-Setup-*.exe.blockmap
            apps/desktop/dist/latest.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release
      - name: Publish complete update feed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          installer="release/Cheongeum-Setup-${GITHUB_REF_NAME#v}.exe"
          assets=("$installer" "$installer.blockmap" release/latest.yml)
          for asset in "${assets[@]}"; do test -s "$asset"; done
          draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [[ "$draft" == true ]]; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --verify-tag --latest --generate-notes --title "청음 ${GITHUB_REF_NAME#v}"
          fi
