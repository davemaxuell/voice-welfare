name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:e2e
      - run: npm run eval
      - run: npm run test-parity
      - run: npm run port-drift

  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: models
          key: desktop-models-${{ runner.os }}-${{ hashFiles('scripts/setup-models.ts') }}
      - run: npm run setup-models
      - run: npm run test:desktop
      - run: npm run dist:win
      - run: npm run test:desktop-packaged
      - run: npm run test:desktop-release
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          compression-level: 0
          if-no-files-found: error
          path: apps/desktop/dist/Cheongeum-Setup-*.exe
