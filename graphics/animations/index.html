<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Avatar responses · Cheongeum</title>
  <style>
    :root {
      font-family: "DM Sans", "Segoe UI", "Malgun Gothic", sans-serif;
      color: #302936; background: #f7f5f1; font-synthesis: none;
      --line: #d8d3d6; --quiet: #625c66; --plum: #5b4365;
    }
    * { box-sizing: border-box }
    body { margin: 0 }
    button, input { font: inherit }
    button, a { touch-action: manipulation }
    button { color: inherit; cursor: pointer }
    a { color: inherit; text-underline-offset: .18em }
    :focus-visible { outline: 3px solid #8958a3; outline-offset: 3px }
    .wrap { width: min(1216px, calc(100% - 96px)); margin-inline: auto }
    header { border-bottom: 1px solid var(--line) }
    .header-inner { min-height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 12px }
    .brand { display: inline-flex; gap: 13px; align-items: center }
    .brand strong { font-size: 23px; letter-spacing: -.09em; line-height: 1 }
    .brand span { border-left: 1px solid #bdb6be; padding-left: 13px; font-size: 14px; font-weight: 540 }
    .model { border: 1px solid #c6bec9; border-radius: 24px; padding: 8px 15px; text-decoration: none; font-size: 13px; font-weight: 600; background: #fbfaf8 }
    .model:hover, .download:hover { background: #eee8f0 }
    main { padding-block: clamp(23px,3vw,43px) 48px }
    h1, h2, p { margin: 0 }
    h1 { font-family: "Baskervville", Cambria, Georgia, serif; font-size: clamp(38px,4.8vw,66px); font-weight: 450; line-height: 1.03; letter-spacing: -.05em; margin-bottom: clamp(20px,2.6vw,34px) }
    .workspace { display: grid; grid-template-columns: minmax(0,1fr) minmax(238px,28%); gap: clamp(22px,3.2vw,46px); align-items: start }
    .viewer { min-width: 0 }
    .player { border: 1px solid #c9c1cb; border-radius: 16px; overflow: hidden; background: #fffdfb }
    .stage { aspect-ratio: 1.7; position: relative; isolation: isolate; overflow: hidden }
    .stage[data-backdrop="dark"] { background: radial-gradient(ellipse at 53% 37%,#605167 0,#473c50 52%,#352e3c 100%) }
    .stage[data-backdrop="light"] { background: #f3eee7 }
    .stage[data-backdrop="grid"] { background: repeating-conic-gradient(#d2cdd1 0 25%,#f4f1ed 0 50%) 50% / 26px 26px }
    video { height: 100%; width: 100%; display: block; object-fit: contain }
    .backdrop { position: absolute; top: 14px; right: 14px; display: flex; align-items: center; gap: 5px; padding: 4px 7px 4px 10px; border-radius: 20px; background: #f9f7f4ef; color: #463e4a; font-size: 12px }
    .backdrop span { margin-right: 3px }
    .swatch { width: 26px; height: 26px; display: grid; place-content: center; background: none; border: 1px solid transparent; border-radius: 50%; padding: 0 }
    .swatch[aria-pressed="true"] { border-color: #4e4056 }
    .swatch::before { content: ""; width: 15px; height: 15px; border: 1px solid #88818a; border-radius: 50% }
    .swatch[data-value="dark"]::before { background:#483c50 }
    .swatch[data-value="light"]::before { background:#f3eee7 }
    .swatch[data-value="grid"]::before { background: repeating-conic-gradient(#a99fab 0 25%,#f6f3f1 0 50%) 0/8px 8px }
    .transport { display: flex; align-items: center; gap: 14px; padding: 10px 16px; min-height: 57px }
    .play { border: 0; background: #49364f; color: #fff; border-radius: 20px; min-width: 80px; min-height: 34px; padding: 5px 12px; font-size: 13px; font-weight: 650 }
    .play:hover { background: #604867 }
    .timeline { min-width: 25px; width: 100%; accent-color: var(--plum); height: 25px; cursor: pointer }
    .clock { color: #514c54; font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap }
    .caption { padding: 20px 1px 0 }
    .caption-head { display: flex; align-items: center; justify-content: space-between; gap: 12px }
    .downloads { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px 12px }
    h2 { font-size: clamp(22px,2.2vw,32px); font-weight: 600; letter-spacing: -.045em; line-height: 1.18 }
    .download { border-radius: 6px; padding: 5px 0 5px 8px; white-space: nowrap; font-size: 13px; font-weight: 600; color: var(--plum) }
    .description { line-height: 1.55; font-size: 15px; margin-top: 7px; max-width: 64ch }
    .spec { color: var(--quiet); font-size: 12px; line-height: 1.5; margin-top: 10px }
    .mapping { display: flex; align-items: baseline; flex-wrap: wrap; gap: 5px 9px; margin-top: 8px; font-size: 12px; color: var(--quiet) }
    .mapping code { font-family: "IBM Plex Mono", Consolas, monospace; font-size: 11px; overflow-wrap: anywhere }
    nav { display: grid; gap: 4px }
    @media (min-width: 691px) {
      #choices { max-height: min(74vh, 46rem); overflow-y: auto; scrollbar-gutter: stable; padding: 4px 5px }
    }
    .option { width: 100%; border: 1px solid transparent; border-radius: 12px; padding: 6px 12px 6px 6px; text-align: left; display: grid; grid-template-columns: 49px minmax(0,1fr) 8px; gap: 13px; align-items: center; background: transparent }
    .option:hover { background: #eee9e9 }
    .option[aria-pressed="true"] { background:#ebe4ec; border-color: #cdbed0 }
    .option[aria-pressed="true"]::after { content:""; width: 6px; height: 6px; border-radius: 50%; background: #6b5178 }
    .thumb { display: grid; place-items: center; width: 49px; height: 47px; background:#e3dce5; border-radius: 8px; overflow: hidden }
    .thumb img { display:block; width: 110%; height: 110%; object-fit: contain; transform: translateY(-2%) }
    .name { display: block; font-weight: 610; font-size: 15px; line-height: 1.25 }
    .ko { display: block; font-size: 12px; color: #625b67; margin-top: 3px }
    .error { padding: 12px 16px; background: #fae6e0 }
    [hidden] { display: none !important }
    @media (max-width: 920px) { .wrap { width: calc(100% - 40px) } .workspace { grid-template-columns: minmax(0,1fr) 215px; gap:18px } .option { grid-template-columns: 42px minmax(0,1fr) 6px; gap:8px } .thumb {width:42px;height:42px} .stage { aspect-ratio: 1.4 } }
    @media (max-width: 690px) {
      .wrap { width: calc(100% - 32px) } .header-inner { min-height: 55px }
      .workspace { grid-template-columns: minmax(0,1fr); gap: 20px }
      nav { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 4px }
      .option { padding: 6px; grid-template-columns: 34px minmax(0,1fr); min-height: 55px; gap: 8px }
      .thumb { width:34px; height:37px } .option[aria-pressed="true"]::after { display:none } .name { font-size:13px } .ko { font-size:11px }
      .stage { aspect-ratio:auto;display:flex;flex-direction:column } .stage video {height:auto;aspect-ratio:1.48}
      .transport { padding:8px 10px; gap:9px } .play { min-width:62px }
      .clock { font-size:11px } .model { font-size:12px } .caption { padding-top:14px }
      .backdrop {position:static;align-self:flex-end;order:-1;margin:8px 8px 0} .brand { gap:9px } .brand span { padding-left:9px }
    }
    @media (forced-colors: active) { .option[aria-pressed="true"], .swatch[aria-pressed="true"] { outline:2px solid Highlight } }
  </style>
</head>

  movie.addEventListener('error', () => { $('error').hidden = false; });
  $('play').addEventListener('click', () => {
    if (movie.paused || movie.ended) {
      wantsPlayback = true;
      if (movie.ended) movie.currentTime = 0;
      startPlayback();
    } else {
      wantsPlayback = false;
      movie.pause();
    }
  });
  $('seek').addEventListener('input', e => { if (movie.readyState) movie.currentTime = Number(e.target.value); });
  reduceMotion.addEventListener('change', e => {
    if (e.matches) { wantsPlayback = false; movie.pause(); }
  });
  document.querySelectorAll('.swatch').forEach(button => button.addEventListener('click', () => {
    $('stage').dataset.backdrop = button.dataset.value;
    document.querySelectorAll('.swatch').forEach(s => s.setAttribute('aria-pressed', String(s === button)));
  }));
  choose(clips.find(c => c.slug === location.hash.slice(1)) || clips.find(c => c.slug === 'idle'));
</script>
</body>
</html>
