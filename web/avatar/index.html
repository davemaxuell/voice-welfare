<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
  </head>
  <body>
    <svg xmlns="http://www.w3.org/2000/svg" class="symbols" aria-hidden="true">
      <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2m-7 9v3m-3 0h6"/></symbol>
      <symbol id="i-muted" viewBox="0 0 24 24"><path d="m3 3 18 18M9 9v3a3 3 0 0 0 4.9 2.3M9.5 4.4a3 3 0 0 1 5.5 1.6v4M5 10v2a7 7 0 0 0 12 4.9M19 10v2a7 7 0 0 1-.2 1.6M12 19v3m-3 0h6"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-yes" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m7.8 12.1 2.7 2.7 5.7-5.8"/></symbol>
      <symbol id="i-no" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6m0-6-6 6"/></symbol>
      <symbol id="i-review" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v5h4M9 12h6m-6 4h5"/></symbol>
      <symbol id="i-read" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3zM15.5 8.5a5 5 0 0 1 0 7m3-10a9 9 0 0 1 0 13"/></symbol>
      <symbol id="i-chat" viewBox="0 0 24 24"><path d="M5 4h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-7l-6 4v-4H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/><path d="M7.5 9h9m-9 4h6"/></symbol>
    </svg>
    <template id="choice-icon"><svg class="icon" aria-hidden="true"><use></use></svg></template>
    <main class="overlay" id="overlay" data-corner="bottom-right" data-mode="offline">
      <section class="card" id="card" aria-labelledby="card-prompt" hidden>
        <div class="bubble">
          <div class="bubble-body">
            <h1 class="card-prompt" id="card-prompt" dir="auto"></h1>
            <p class="card-site" id="card-site" hidden></p>
            <div class="choices" id="choices" role="group" aria-labelledby="card-prompt"></div>
          </div>
        </div>
      </section>
      <div class="dock">
        <div class="panel">
          <p class="mic" id="mic" data-capture="off"><svg class="icon" aria-hidden="true"><use class="mic-off" href="#i-muted"></use><use class="mic-on" href="#i-mic"></use></svg><span id="mic-text"></span><span id="mic-short" aria-hidden="true"></span></p>
          <p class="status" id="status" role="status" aria-atomic="true"></p>
          <div class="controls">
            <button type="button" id="talk" class="primary" aria-keyshortcuts="Control+Shift+Space Meta+Shift+Space" disabled><span class="sound-icon" aria-hidden="true"></span></button>
            <button type="button" id="stop" class="stop" hidden><span class="stop-icon" aria-hidden="true"></span></button>
            <button type="button" id="hide" class="quiet"><svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg></button>
          </div>
        </div>
        <button type="button" class="avatar" id="avatar" aria-keyshortcuts="ArrowLeft ArrowRight ArrowUp ArrowDown">
          <span class="figure" id="figure" data-pose="still" data-renderer="image">
            <img class="still" id="still" src="/avatar/poses/ready.webp" alt="" draggable="false" />
            <img class="still" id="sleeping-still" src="/avatar/sleeping.png" alt="" draggable="false" />
            <canvas id="character" aria-hidden="true" hidden></canvas>
          </span>
          <span class="avatar-caption" aria-hidden="true"><svg class="icon chat-glyph"><use href="#i-chat"></use></svg></span>
        </button>
      </div>
    </main>
    <script type="module" src="/src/avatar/overlay.ts"></script>
  </body>
</html>
