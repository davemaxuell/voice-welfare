appId: kr.cheongeum.app
productName: 청음
copyright: Copyright © 청음
directories:
  output: dist
  buildResources: build
afterPack: ./build/after-pack.cjs
toolsets:
  winCodeSign: 1.1.0
files:
  - main.cjs
  - updates.cjs
  - preload.cjs
  - overlay-preload.cjs
  - package.json
  - "!**/*.map"
extraResources:
  - from: ../../docs/install.md
    to: install.md
  - from: ../../src/cheongeum/web/static/avatar/still.png
    to: icon.png
win:
  publish:
    provider: github
    owner: davemaxuell
    repo: voice-welfare
  icon: ../../src/cheongeum/web/static/avatar/still.png
  signExecutable: false
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Cheongeum-Setup-${version}.${ext}
  # 서명 없음(주인 결정). SmartScreen 경고는 docs/install.md 참고.
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  include: build/installer.nsh
  allowToChangeInstallationDirectory: true
  shortcutName: 청음
  installerLanguages:
    - ko_KR
    - en_US
mac:
  target: dmg
  icon: ../../graphics/mascot-original-refined.png
  artifactName: 청음-${version}-${arch}.${ext}
  # 서명·공증 없음. Gatekeeper는 docs/install.md 참고.
  identity: null
  category: public.app-category.utilities
  extendInfo:
    NSMicrophoneUsageDescription: 청음이 말로 요청을 받을 때 마이크를 사용합니다.
dmg:
  title: 청음
