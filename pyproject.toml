[project]
name = "cheongeum-voice-welfare-agent"
version = "0.1.0"
description = "청음 — 시각장애인이 음성으로 웹을 읽고 공공서비스 신청을 끝까지 하도록 돕는 PC 음성 에이전트 (Python)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "httpx>=0.27",
  "playwright>=1.52",
  "python-dotenv>=1.0",
  "regex>=2024.9.11",
  "faster-whisper>=1.1",
  "cryptography>=50.0.2",
  "keyring>=25.7.0",
  "pypdf>=7.1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
]

[project.scripts]
cheongeum-server = "cheongeum.server.__main__:main"
cheongeum-mock = "cheongeum.practice_site.serve:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cheongeum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["ignore::DeprecationWarning"]
